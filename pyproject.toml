[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oarepo-ark"
version = "1.0.0"
description = "ARK (Archival Resource Key) minting and resolution for Invenio / OARepo repositories"
readme = "README.md"
license = "MIT"
dependencies = [
    "invenio-pidstore>=3.0.0",
    # invenio-rdm-records' PID machinery mints ARKs; the landing-page box uses invenio-app-rdm's
    # CopyButton / theme.js and invenio-formatter's badge generator
    "invenio-app-rdm>=14.0.0",
    "invenio-records-resources>=10.0.0",
]
requires-python = ">=3.14,<3.15"

[project.urls]
Homepage = "https://github.com/oarepo/oarepo-ark"

[project.optional-dependencies]
dev = [
    "pytest>=7.1.2",
]
tests = [
    "pytest>=7.1.2",
    "pytest-invenio>=3.0.0",  # real InvenioRDM app, database and search in the tests
]
# just for our git workflows, should be removed if it becomes invenio-ark
oarepo14 = [
    "oarepo[rdm]>=14,<15",
]

[project.entry-points."invenio_base.api_apps"]
oarepo_ark = "oarepo_ark.ext:OARepoARK"

[project.entry-points."invenio_base.apps"]
oarepo_ark = "oarepo_ark.ext:OARepoARK"

[project.entry-points."invenio_base.blueprints"]
oarepo_ark = "oarepo_ark.resolver:create_blueprint"

[project.entry-points."invenio_base.finalize_app"]
oarepo_ark = "oarepo_ark.ext:finalize_app"

[project.entry-points."invenio_base.api_finalize_app"]
oarepo_ark = "oarepo_ark.ext:finalize_app"

[project.entry-points."invenio_assets.webpack"]
oarepo_ark = "oarepo_ark.theme.webpack:theme"

[project.entry-points."invenio_i18n.translations"]
oarepo_ark_messages = "oarepo_ark"

[project.entry-points."flask.commands"]
ark = "oarepo_ark.cli:ark"

[tool.hatch.build.targets.sdist]
include = [
    "/oarepo_ark",
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
